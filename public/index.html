<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JeenyChatbot | مساعد رحلات بالعامية الأردنية</title>
  <meta name="description" content="Ride-booking chat assistant that understands Jordanian Arabic and English: LangChain agent, free LLMs, OpenStreetMap.">
  <meta name="theme-color" content="#ec008c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var theme = null;
      try { theme = JSON.parse(localStorage.getItem("jc.theme")); } catch (e) {}
      if (!theme) theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 32 32">
      <path d="M16 2.5C8.8 2.5 3 8 3 14.8c0 6.1 4.7 11.1 10.8 12l2.2 3.4 2.2-3.4C24.3 25.9 29 20.9 29 14.8 29 8 23.2 2.5 16 2.5z" fill="var(--logo-body)"/>
      <path d="M11 17.6c2.4-6.2 6.7-1.3 9.6-6" fill="none" stroke="var(--logo-route)" stroke-width="1.7" stroke-linecap="round" stroke-dasharray=".1 3.1"/>
      <circle cx="10.3" cy="18.2" r="2.7" fill="var(--logo-pickup)"/>
      <rect x="19" y="8.4" width="5.2" height="5.2" rx="1.3" fill="var(--logo-drop)"/>
    </symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-places" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6.8l1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z" fill="currentColor"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.8" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-car-economy" viewBox="0 0 40 20"><path d="M4 14v-3.2c0-1 .6-1.8 1.6-2.1L11 7l4.3-3.6c.7-.6 1.6-.9 2.5-.9h7.4c1 0 1.9.4 2.6 1.1L31 7l4 1c1 .3 1.6 1.1 1.6 2.1V14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 14h34" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="11" cy="14.5" r="2.8" fill="var(--paper)" stroke="currentColor" stroke-width="1.7"/><circle cx="29" cy="14.5" r="2.8" fill="var(--paper)" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-car-taxi" viewBox="0 0 40 20"><use href="#i-car-economy"/><rect x="17.5" y="0" width="6" height="2.6" rx=".8" fill="currentColor"/></symbol>
    <symbol id="i-car-family" viewBox="0 0 40 20"><path d="M3.5 14V6.5c0-1.7 1.3-3 3-3h19.3c.9 0 1.7.4 2.3 1L33 9l2.4.7c.9.3 1.6 1.1 1.6 2.1V14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 14h34M15 3.6V9M24 3.6V9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="10" cy="14.5" r="2.8" fill="var(--paper)" stroke="currentColor" stroke-width="1.7"/><circle cx="29.5" cy="14.5" r="2.8" fill="var(--paper)" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-car-vip" viewBox="0 0 40 20"><path d="M3 14v-2.6c0-1 .6-1.8 1.6-2.1L12 7.5l3.6-3c.7-.6 1.6-.9 2.5-.9h6.6c1 0 1.9.4 2.6 1.1L30.5 7.5l5 1.5c.9.3 1.5 1.1 1.5 2V14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M2.5 14h35" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M20 6.2l.8 1.5 1.7.3-1.2 1.1.3 1.7-1.6-.8-1.6.8.3-1.7-1.2-1.1 1.7-.3z" fill="currentColor"/><circle cx="10.5" cy="14.5" r="2.8" fill="var(--paper)" stroke="currentColor" stroke-width="1.7"/><circle cx="29.5" cy="14.5" r="2.8" fill="var(--paper)" stroke="currentColor" stroke-width="1.7"/></symbol>
  </svg>

  <div class="app">
    <div id="map" class="map" role="region" data-i18n-aria="map.aria" aria-label="خريطة الرحلة"></div>

    <aside class="panel" id="panel">
      <header class="panel-head">
        <div class="brand">
          <svg class="brand-mark" aria-hidden="true"><use href="#i-logo"/></svg>
          <span class="brand-name">JeenyChatbot</span>
        </div>
        <nav class="head-actions">
          <button class="icon-btn" id="newBtn" type="button" data-i18n-aria="head.new"><svg><use href="#i-new"/></svg></button>
          <button class="icon-btn" id="placesBtn" type="button" data-i18n-aria="head.places"><svg><use href="#i-places"/></svg></button>
          <button class="icon-btn" id="themeBtn" type="button" data-i18n-aria="head.theme"><svg><use href="#i-moon"/></svg></button>
          <button class="icon-btn" id="aboutBtn" type="button" data-i18n-aria="head.about"><svg><use href="#i-info"/></svg></button>
          <button class="lang-btn" id="langBtn" type="button" data-i18n="head.lang" data-i18n-aria="head.langAria">English</button>
        </nav>
      </header>

      <p class="mode-banner" id="modeBanner" role="status" data-i18n="mode.rules" hidden></p>

      <section class="log" id="log" aria-live="polite">
        <div class="hero" id="hero">
          <h1 class="hero-title" data-i18n="hero.title">وين رايح؟</h1>
          <svg class="hero-route" viewBox="0 0 168 22" aria-hidden="true">
            <path class="route-draw" d="M15 14 C 52 1, 96 25, 149 8" fill="none" stroke-width="2.6" stroke-linecap="round"/>
            <circle cx="9" cy="14" r="5.5" fill="var(--brand)" stroke="var(--paper)" stroke-width="2.5"/>
            <rect x="150" y="2" width="12" height="12" rx="3" fill="var(--plum)"/>
          </svg>
          <p class="hero-sub" data-i18n="hero.sub"></p>
          <div class="chips" id="chips"></div>
        </div>
      </section>

      <section class="trip-panel" id="tripPanel" data-i18n-aria="trip.panelLabel" hidden>
        <div class="trip-route">
          <ol class="itinerary">
            <li class="stop stop-pickup"><span class="stop-dot" aria-hidden="true"></span><span class="stop-name" id="tripPickup"></span></li>
            <li class="stop stop-dropoff"><span class="stop-dot" aria-hidden="true"></span><span class="stop-name" id="tripDropoff"></span></li>
          </ol>
          <p class="trip-stats" id="tripStats"></p>
        </div>
        <div class="car-rail" id="carRail" role="radiogroup" data-i18n-aria="trip.carsLabel"></div>
        <div class="trip-foot" id="tripFoot"></div>
      </section>

      <form class="composer" id="composer" autocomplete="off">
        <button class="comp-btn" id="locBtn" type="button" data-i18n-aria="composer.location"><svg><use href="#i-locate"/></svg></button>
        <label class="sr-only" for="input" data-i18n="composer.placeholder"></label>
        <input class="comp-input" id="input" name="message" maxlength="300" dir="auto" data-i18n-placeholder="composer.placeholder">
        <button class="comp-btn" id="micBtn" type="button" data-i18n-aria="composer.mic"><svg><use href="#i-mic"/></svg></button>
        <button class="send-btn" id="sendBtn" type="submit" data-i18n-aria="composer.send"><svg><use href="#i-send"/></svg></button>
      </form>
      <p class="disclaimer" data-i18n="footer.disclaimer"></p>
    </aside>

    <div class="pick-banner" id="pickBanner" role="dialog" aria-labelledby="pickText" hidden>
      <span id="pickText"></span>
      <div class="pick-actions">
        <button type="button" class="pick-confirm" id="pickConfirm" data-i18n="pin.confirm"></button>
        <button type="button" class="text-btn" id="pickCancel" data-i18n="common.cancel"></button>
      </div>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>

  <dialog class="sheet" id="placesDialog">
    <div class="sheet-head">
      <h2 data-i18n="places.title"></h2>
      <button class="icon-btn" type="button" data-close data-i18n-aria="places.close"><svg><use href="#i-close"/></svg></button>
    </div>
    <p class="sheet-note" data-i18n="places.note"></p>
    <ul class="place-list" id="placeList"></ul>
    <form class="place-form" id="placeForm">
      <label for="placeName" data-i18n="places.name"></label>
      <input id="placeName" maxlength="40" dir="auto" data-i18n-placeholder="places.namePh" required>
      <p class="form-error" id="placeError" role="alert" hidden></p>
      <div class="place-form-actions">
        <button type="button" class="primary-btn" id="pickOnMapBtn" data-i18n="places.pickOnMap"></button>
        <button type="button" class="secondary-btn" id="useGpsBtn" data-i18n="places.useGps"></button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="aboutDialog">
    <div class="sheet-head">
      <h2 data-i18n="about.title"></h2>
      <button class="icon-btn" type="button" data-close data-i18n-aria="places.close"><svg><use href="#i-close"/></svg></button>
    </div>
    <p data-i18n="about.p1"></p>
    <p data-i18n="about.p2"></p>
    <p data-i18n="about.p3"></p>
    <p class="sheet-note" data-i18n="about.p4"></p>
    <p class="about-links">
      <a href="https://github.com/anaskasasbeh/JeenyChatbot" target="_blank" rel="noopener" data-i18n="about.code"></a>
      <a href="https://anaskasasbeh.vercel.app" target="_blank" rel="noopener" data-i18n="about.author"></a>
    </p>
  </dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
